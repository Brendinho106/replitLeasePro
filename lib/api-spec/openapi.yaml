openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: LeasePro API - RAG-powered lease intelligence platform
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: documents
    description: Lease document management and ingestion
  - name: sync
    description: SharePoint library sync
  - name: openai
    description: OpenAI AI chat operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # Documents
  /documents:
    get:
      operationId: listDocuments
      tags: [documents]
      summary: List all uploaded lease documents
      responses:
        "200":
          description: List of documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"

  /documents/stats:
    get:
      operationId: getDocumentStats
      tags: [documents]
      summary: Get portfolio statistics
      responses:
        "200":
          description: Portfolio statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentStats"

  /documents/{id}:
    get:
      operationId: getDocument
      tags: [documents]
      summary: Get a document by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteDocument
      tags: [documents]
      summary: Delete a document and its chunks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /documents/tree:
    get:
      operationId: getDocumentTree
      tags: [documents]
      summary: Get nested folder tree for document library
      responses:
        "200":
          description: Folder tree with sync status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentTreeResponse"

  /sync/status:
    get:
      operationId: getSyncStatus
      tags: [sync]
      summary: SharePoint sync connection status
      responses:
        "200":
          description: Sync status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncStatus"

  /sync/run:
    post:
      operationId: runSync
      tags: [sync]
      summary: Trigger SharePoint mirror sync
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncRunResult"
        "500":
          description: Sync error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # OpenAI conversations
  /openai/conversations:
    get:
      operationId: listOpenaiConversations
      tags: [openai]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiConversation"
    post:
      operationId: createOpenaiConversation
      tags: [openai]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversation"

  /openai/conversations/{id}:
    get:
      operationId: getOpenaiConversation
      tags: [openai]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteOpenaiConversation
      tags: [openai]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /openai/conversations/{id}/messages:
    get:
      operationId: listOpenaiMessages
      tags: [openai]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiMessage"
    post:
      operationId: sendOpenaiMessage
      tags: [openai]
      summary: Send a message and get a RAG-powered streaming response
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "200":
          description: SSE stream of assistant text chunks
          content:
            text/event-stream: {}

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Document:
      type: object
      properties:
        id:
          type: integer
        filename:
          type: string
        originalName:
          type: string
        fileType:
          type: string
        status:
          type: string
          enum: [pending, processing, ready, error]
        chunkCount:
          type: ["integer", "null"]
        errorMessage:
          type: ["string", "null"]
        uploadedAt:
          type: string
          format: date-time
        processedAt:
          type: ["string", "null"]
          format: date-time
        folderId:
          type: ["integer", "null"]
        source:
          type: string
          enum: [upload, sharepoint]
        relativePath:
          type: ["string", "null"]
        visibility:
          type: string
          enum: [all, restricted]
      required:
        - id
        - filename
        - originalName
        - fileType
        - status
        - uploadedAt

    DocumentStats:
      type: object
      properties:
        totalDocuments:
          type: integer
        readyDocuments:
          type: integer
        processingDocuments:
          type: integer
        errorDocuments:
          type: integer
        totalChunks:
          type: integer
        fileTypeBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/FileTypeCount"
      required:
        - totalDocuments
        - readyDocuments
        - processingDocuments
        - errorDocuments
        - totalChunks
        - fileTypeBreakdown

    FileTypeCount:
      type: object
      properties:
        fileType:
          type: string
        count:
          type: integer
      required:
        - fileType
        - count

    SyncStatus:
      type: object
      properties:
        connectionId:
          type: ["integer", "null"]
        provider:
          type: string
        siteUrl:
          type: string
        rootFolderPath:
          type: string
        syncStatus:
          type: string
        lastSyncedAt:
          type: ["string", "null"]
          format: date-time
        lastSyncError:
          type: ["string", "null"]
        isConfigured:
          type: boolean
        isStub:
          type: boolean
        message:
          type: string
      required:
        - provider
        - siteUrl
        - rootFolderPath
        - syncStatus
        - isConfigured
        - isStub
        - message

    SyncRunResult:
      type: object
      properties:
        mode:
          type: string
          enum: [stub, live]
        added:
          type: integer
        deleted:
          type: integer
        skipped:
          type: integer
        message:
          type: string
      required:
        - mode
        - added
        - deleted
        - skipped
        - message

    DocumentTreeFile:
      type: object
      properties:
        type:
          type: string
          enum: [file]
        id:
          type: integer
        name:
          type: string
        fileType:
          type: string
        status:
          type: string
        chunkCount:
          type: ["integer", "null"]
        source:
          type: string
        relativePath:
          type: ["string", "null"]
        uploadedAt:
          type: string
          format: date-time
      required:
        - type
        - id
        - name
        - fileType
        - status
        - source
        - uploadedAt

    DocumentTreeFolder:
      type: object
      properties:
        type:
          type: string
          enum: [folder]
        id:
          type: integer
        name:
          type: string
        path:
          type: string
        isLocal:
          type: boolean
        children:
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/DocumentTreeFolder"
              - $ref: "#/components/schemas/DocumentTreeFile"
      required:
        - type
        - id
        - name
        - path
        - isLocal
        - children

    DocumentTreeResponse:
      type: object
      properties:
        sync:
          $ref: "#/components/schemas/SyncStatus"
        tree:
          type: array
          items:
            $ref: "#/components/schemas/DocumentTreeFolder"
      required:
        - sync
        - tree

    OpenaiConversation:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - createdAt

    OpenaiConversationWithMessages:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/OpenaiMessage"
      required:
        - id
        - title
        - createdAt
        - messages

    OpenaiMessage:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        role:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - conversationId
        - role
        - content
        - createdAt

    ConversationInput:
      type: object
      properties:
        title:
          type: string
      required:
        - title

    MessageInput:
      type: object
      properties:
        content:
          type: string
      required:
        - content
